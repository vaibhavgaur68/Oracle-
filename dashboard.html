
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE — Dashboard</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
        /* ── Today header ── */
        .today-header {
            background: var(--yellow);
            border: var(--border-width) solid var(--black);
            border-radius: var(--r-xl);
            padding: var(--gap-lg) var(--gap-xl);
            margin-bottom: var(--gap-lg);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .today-header::after {
            content: 'ORACLE';
            position: absolute;
            right: -10px; top: -10px;
            font-family: var(--font-display);
            font-size: 80px;
            font-weight: 900;
            color: rgba(10,10,10,0.06);
            pointer-events: none;
            line-height: 1;
        }

        .today-date {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--black);
            opacity: 0.6;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .today-greeting {
            font-family: var(--font-display);
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 900;
            margin-bottom: var(--gap-md);
            color: var(--black);
        }

        .cl-section { margin-top: var(--gap-md); }

        .cl-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .cl-label {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--black);
            opacity: 0.7;
        }

        .cl-value {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 900;
            color: var(--black);
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap-sm);
            margin-bottom: var(--gap-lg);
        }

        /* Drift banner */
        .drift-banner {
            border-radius: var(--r-lg);
            padding: var(--gap-md);
            background: var(--pink-light);
            border: var(--border-width) solid var(--pink);
            box-shadow: var(--shadow-pink);
            margin-bottom: var(--gap-lg);
        }

        .drift-title {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 900;
            color: var(--pink);
            margin-bottom: var(--gap-sm);
            letter-spacing: 0.04em;
        }

        .drift-item {
            font-size: 12px;
            font-weight: 600;
            color: var(--black);
            padding: 5px 0;
            border-bottom: 1.5px solid rgba(255,45,126,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drift-item:last-child { border-bottom: none; }

        /* Schedule items */
        .schedule-item {
            background: var(--white);
            border: var(--border-width) solid var(--black);
            border-radius: var(--r-lg);
            padding: var(--gap-md);
            display: flex;
            align-items: center;
            gap: var(--gap-md);
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            overflow: hidden;
        }

        .schedule-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-lg);
        }

        .schedule-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 5px;
        }

        .schedule-item[data-strategy="BREACH"]::before  { background: var(--pink); }
        .schedule-item[data-strategy="SPRINT"]::before  { background: var(--warning); }
        .schedule-item[data-strategy="MARATHON"]::before { background: var(--success); }

        .schedule-item.done { opacity: 0.5; }
        .schedule-item.done .item-title { text-decoration: line-through; }

        .item-checkbox {
            width: 24px; height: 24px;
            border-radius: var(--r-sm);
            border: var(--border-width) solid var(--black);
            background: var(--white);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            color: transparent;
            transition: all 0.15s;
            box-shadow: 2px 2px 0 var(--black);
        }

        .item-checkbox:hover { background: var(--pink-light); }

        .schedule-item.done .item-checkbox {
            background: var(--pink);
            color: white;
            box-shadow: 2px 2px 0 var(--black);
        }

        .item-body { flex: 1; min-width: 0; }

        .item-title {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            color: var(--black);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .item-units {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--pink);
            font-weight: 700;
            flex-shrink: 0;
            background: var(--pink-light);
            padding: 2px 8px;
            border: 1.5px solid var(--black);
            border-radius: var(--r-sm);
        }

        .free-day-card {
            text-align: center;
            padding: var(--gap-2xl);
        }

        .free-day-card .free-icon  { font-size: 40px; margin-bottom: var(--gap-md); display: block; }
        .free-day-card .free-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 900;
            margin-bottom: var(--gap-sm);
        }
    </style>
</head>
