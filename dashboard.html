<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE — Dashboard</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
        .today-header {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-2xl);
            padding: var(--gap-lg) var(--gap-lg);
            margin-bottom: var(--gap-lg);
            position: relative;
            overflow: hidden;
        }

        /* Amber glow top-right */
        .today-header::before {
            content: '';
            position: absolute;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(240,165,0,0.12) 0%, transparent 70%);
            top: -60px; right: -40px;
            pointer-events: none;
        }

        .today-date {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            position: relative; z-index: 1;
        }

        .today-greeting {
            font-family: var(--font-display);
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 800;
            margin-bottom: var(--gap-lg);
            letter-spacing: -0.3px;
            position: relative; z-index: 1;
        }

        .cl-section { position: relative; z-index: 1; }

        .cl-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .cl-label {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .cl-value {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: var(--gap-sm);
            margin-bottom: var(--gap-lg);
        }

        .drift-banner {
            border-radius: var(--r-xl);
            padding: var(--gap-md);
            background: var(--danger-dim);
            border: 1px solid rgba(255,94,122,0.18);
            margin-bottom: var(--gap-lg);
        }

        .drift-title {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--danger);
            margin-bottom: var(--gap-sm);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .drift-item {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,94,122,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drift-item:last-child { border-bottom: none; }

        /* Schedule items */
        .schedule-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 14px var(--gap-md);
            display: flex;
            align-items: center;
            gap: var(--gap-md);
            transition: background 0.18s, border-color 0.18s;
            position: relative;
            overflow: hidden;
        }

        .schedule-item:active { background: var(--surface-2); }

        .schedule-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: var(--r-xl) 0 0 var(--r-xl);
        }

        .schedule-item[data-strategy="BREACH"]::before   { background: var(--danger); }
        .schedule-item[data-strategy="SPRINT"]::before   { background: var(--amber); }
        .schedule-item[data-strategy="MARATHON"]::before { background: var(--success); }

        .schedule-item.done { opacity: 0.38; }
        .schedule-item.done .item-title { text-decoration: line-through; }

        .item-checkbox {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 1.5px solid var(--border-strong);
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: transparent;
            transition: all 0.18s;
        }

        .item-checkbox:hover { border-color: var(--amber); }

        .schedule-item.done .item-checkbox {
            background: var(--amber);
            border-color: var(--amber);
            color: var(--bg);
            box-shadow: 0 0 0 3px var(--amber-dim);
        }

        .item-body { flex: 1; min-width: 0; }

        .item-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .item-units {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            color: var(--amber);
            flex-shrink: 0;
        }

        .free-day-card { text-align: center; padding: var(--gap-2xl) var(--gap-lg); }
        .free-day-card .free-icon  { font-size: 40px; display: block; margin-bottom: var(--gap-md); opacity: 0.6; }
        .free-day-card .free-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: var(--gap-sm); }
    </style>
</head>
<body>

</body>
