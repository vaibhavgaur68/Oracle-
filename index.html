<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --black:  #0A0A0A;
            --white:  #FFFFFF;
            --pink:   #FF2D7E;
            --purple: #6B21E8;
            --yellow: #FFE500;
            --bg:     #F5F0FF;
            --bg-2:   #EDE6FF;
            --pink-light: #FFD6E8;
            --purple-light: #E9D5FF;
            --border-width: 2.5px;
            --shadow: 4px 4px 0px #0A0A0A;
            --shadow-lg: 6px 6px 0px #0A0A0A;
            --r-md: 6px; --r-lg: 8px; --r-xl: 10px; --r-full: 999px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--black);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: radial-gradient(circle, #C4B5FD 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Decorative blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 320px; height: 320px;
            background: var(--pink);
            opacity: 0.12;
            top: -80px; left: -80px;
        }
        body::after {
            width: 260px; height: 260px;
            background: var(--purple);
            opacity: 0.1;
            bottom: -60px; right: -60px;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-block;
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: var(--black);
            background: var(--yellow);
            padding: 8px 20px;
            border: var(--border-width) solid var(--black);
            box-shadow: var(--shadow-lg);
        }

        .brand-tag {
            display: block;
            margin-top: 10px;
            font-family: 'Unbounded', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--purple);
            text-transform: uppercase;
        }

        /* Card */
        .card {
            background: var(--white);
            border: var(--border-width) solid var(--black);
            border-radius: var(--r-xl);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }

        /* Tabs */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: var(--border-width) solid var(--black);
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 28px;
        }

        .tab-btn {
            padding: 11px;
            border: none;
            background: var(--bg);
            color: var(--black);
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tab-btn:first-child { border-right: var(--border-width) solid var(--black); }
        .tab-btn.active { background: var(--pink); color: var(--white); }

        /* Form */
        .form { display: flex; flex-direction: column; gap: 14px; }

        .field { display: flex; flex-direction: column; gap: 5px; }

        label {
            font-family: 'Unbounded', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--black);
        }

        input {
            background: var(--white);
            border: var(--border-width) solid var(--black);
            border-radius: var(--r-md);
            padding: 12px 14px;
            color: var(--black);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            box-shadow: 3px 3px 0 var(--black);
            transition: box-shadow 0.15s, transform 0.15s;
            width: 100%;
        }

        input:focus {
            box-shadow: 3px 3px 0 var(--pink);
            border-color: var(--pink);
            transform: translate(-1px, -1px);
        }

        input::placeholder { color: #BBBBBB; font-weight: 400; }

        .btn-primary {
            margin-top: 6px;
            padding: 14px;
            background: var(--pink);
            color: var(--white);
            border: var(--border-width) solid var(--black);
            border-radius: var(--r-md);
            font-family: 'Unbounded', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
        }

        .btn-primary:hover  { transform: translate(-2px,-2px); box-shadow: var(--shadow-lg); }
        .btn-primary:active { transform: translate(2px,2px);   box-shadow: none; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: var(--shadow); }

        .status {
            font-size: 13px;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: var(--r-md);
            border: var(--border-width) solid var(--black);
            display: none;
            margin-top: 4px;
        }

        .status.error   { background: var(--pink-light);   color: var(--pink);   display: block; }
        .status.success { background: #C4F7EA;             color: #007A5A;       display: block; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand">
        <span class="brand-logo">ORACLE</span>
        <span class="brand-tag">Your intelligent planning engine</span>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tab-login"  onclick="showTab('login')">Log In</button>
            <button class="tab-btn"        id="tab-signup" onclick="showTab('signup')">Sign Up</button>
        </div>

        <div id="form-login">
            <div class="form">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" />
                </div>
                <button class="btn-primary" id="login-btn" onclick="handleLogin()">Log In →</button>
                <div class="status" id="login-status"></div>
            </div>
        </div>

        <div id="form-signup" style="display:none;">
            <div class="form">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" placeholder="Your name" />
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="At least 6 characters" />
                </div>
                <button class="btn-primary" id="signup-btn" onclick="handleSignup()">Create Account →</button>
                <div class="status" id="signup-status"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { login, signUp, getCurrentUser } from './js/auth.js';

    getCurrentUser().then(user => {
        if (user) window.location.href = '/dashboard.html';
    });

    window.showTab = function(tab) {
        const isLogin = tab === 'login';
        document.getElementById('form-login').style.display  = isLogin ? 'block' : 'none';
        document.getElementById('form-signup').style.display = isLogin ? 'none'  : 'block';
        document.getElementById('tab-login').classList.toggle('active',  isLogin);
        document.getElementById('tab-signup').classList.toggle('active', !isLogin);
    };

    window.handleLogin = async function() {
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn      = document.getElementById('login-btn');
        const status   = document.getElementById('login-status');
        if (!email || !password) { showStatus(status, 'Please fill in both fields.', 'error'); return; }
        btn.disabled = true; btn.textContent = 'Logging in…';
        status.className = 'status';
        try {
            await login(email, password);
            window.location.href = '/dashboard.html';
        } catch (err) {
            showStatus(status, err.message || 'Login failed.', 'error');
            btn.disabled = false; btn.textContent = 'Log In →';
        }
    };

    window.handleSignup = async function() {
        const name     = document.getElementById('signup-name').value.trim();
        const email    = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const btn      = document.getElementById('signup-btn');
        const status   = document.getElementById('signup-status');
        if (!name || !email || !password) { showStatus(status, 'Please fill in all fields.', 'error'); return; }
        if (password.length < 6) { showStatus(status, 'Password must be at least 6 characters.', 'error'); return; }
        btn.disabled = true; btn.textContent = 'Creating account…';
        status.className = 'status';
        try {
            await signUp(name, email, password);
            showStatus(status, 'Account created! Now log in.', 'success');
            btn.textContent = 'Done!';
        } catch (err) {
            showStatus(status, err.message || 'Signup failed.', 'error');
            btn.disabled = false; btn.textContent = 'Create Account →';
        }
    };

    function showStatus(el, message, type) {
        el.textContent = message;
        el.className = `status ${type}`;
    }

    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const loginVisible = document.getElementById('form-login').style.display !== 'none';
        if (loginVisible) handleLogin(); else handleSignup();
    });
</script>
</body>
</html>
