<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #0E0B14;
            --bg-3:         #1A1525;
            --surface:      rgba(255,255,255,0.04);
            --surface-2:    rgba(255,255,255,0.07);
            --border:       rgba(255,255,255,0.08);
            --border-strong:rgba(255,255,255,0.14);
            --amber:        #F0A500;
            --amber-soft:   #F5B833;
            --amber-dim:    rgba(240,165,0,0.12);
            --violet:       #9B6DFF;
            --text:         #F0EAF8;
            --text-2:       #B8A9CF;
            --muted:        #6B5F80;
            --danger:       #FF5E7A;
            --danger-dim:   rgba(255,94,122,0.12);
            --success:      #2ED573;
        }

        body {
            font-family: 'Figtree', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 80% 0%,   rgba(240,165,0,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 10% 100%, rgba(155,109,255,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            animation: riseIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Brand mark */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px; height: 56px;
            background: var(--amber-dim);
            border: 1px solid rgba(240,165,0,0.25);
            border-radius: 16px;
            font-size: 26px;
            margin-bottom: 14px;
        }

        .brand-name {
            display: block;
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--amber);
        }

        .brand-sub {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 22px;
            padding: 28px 24px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 999px;
            padding: 3px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-family: 'Figtree', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--amber);
            color: var(--bg);
        }

        /* Form */
        .form { display: flex; flex-direction: column; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 5px; }

        label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-2);
        }

        input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text);
            font-family: 'Figtree', sans-serif;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            width: 100%;
            transition: all 0.18s;
        }

        input:focus {
            border-color: var(--amber);
            background: rgba(240,165,0,0.06);
            box-shadow: 0 0 0 3px rgba(240,165,0,0.12);
        }

        input::placeholder { color: var(--muted); font-weight: 400; }

        .btn-submit {
            margin-top: 6px;
            padding: 14px;
            background: var(--amber);
            color: var(--bg);
            border: none;
            border-radius: 999px;
            font-family: 'Figtree', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.18s;
            width: 100%;
            box-shadow: 0 4px 20px rgba(240,165,0,0.28);
        }

        .btn-submit:hover { background: var(--amber-soft); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(240,165,0,0.36); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .status {
            font-size: 13px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            display: none;
            margin-top: 4px;
        }

        .status.error   { background: var(--danger-dim);  color: var(--danger);  border-color: rgba(255,94,122,0.2);  display: block; }
        .status.success { background: rgba(46,213,115,0.1); color: var(--success); border-color: rgba(46,213,115,0.2); display: block; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="brand">
        <div class="brand-mark">◎</div>
        <span class="brand-name">ORACLE</span>
        <span class="brand-sub">Intelligent Planning Engine</span>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tab-login"  onclick="showTab('login')">Log In</button>
            <button class="tab-btn"        id="tab-signup" onclick="showTab('signup')">Sign Up</button>
        </div>

        <div id="form-login">
            <div class="form">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" />
                </div>
                <button class="btn-submit" id="login-btn" onclick="handleLogin()">Log In</button>
                <div class="status" id="login-status"></div>
            </div>
        </div>

        <div id="form-signup" style="display:none;">
            <div class="form">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" placeholder="Your name" />
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Min. 6 characters" />
                </div>
                <button class="btn-submit" id="signup-btn" onclick="handleSignup()">Create Account</button>
                <div class="status" id="signup-status"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { login, signUp, getCurrentUser } from './js/auth.js';
    getCurrentUser().then(u => { if (u) window.location.href = '/dashboard.html'; });

    window.showTab = (tab) => {
        const isLogin = tab === 'login';
        document.getElementById('form-login').style.display  = isLogin ? 'block' : 'none';
        document.getElementById('form-signup').style.display = isLogin ? 'none'  : 'block';
        document.getElementById('tab-login').classList.toggle('active',  isLogin);
        document.getElementById('tab-signup').classList.toggle('active', !isLogin);
    };

    window.handleLogin = async () => {
        const email = document.getElementById('login-email').value.trim();
        const pass  = document.getElementById('login-password').value;
        const btn   = document.getElementById('login-btn');
        const msg   = document.getElementById('login-status');
        if (!email || !pass) { show(msg,'Fill in both fields.','error'); return; }
        btn.disabled = true; btn.textContent = 'Logging in…';
        msg.className = 'status';
        try { await login(email, pass); window.location.href = '/dashboard.html'; }
        catch(e) { show(msg, e.message||'Login failed.','error'); btn.disabled=false; btn.textContent='Log In'; }
    };

    window.handleSignup = async () => {
        const name  = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const pass  = document.getElementById('signup-password').value;
        const btn   = document.getElementById('signup-btn');
        const msg   = document.getElementById('signup-status');
        if (!name||!email||!pass) { show(msg,'Fill in all fields.','error'); return; }
        if (pass.length < 6)      { show(msg,'Password min. 6 characters.','error'); return; }
        btn.disabled = true; btn.textContent = 'Creating account…';
        msg.className = 'status';
        try { await signUp(name,email,pass); show(msg,'Account created! Now log in.','success'); btn.textContent='Done!'; }
        catch(e) { show(msg,e.message||'Signup failed.','error'); btn.disabled=false; btn.textContent='Create Account'; }
    };

    const show = (el,msg,type) => { el.textContent=msg; el.className=`status ${type}`; };

    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        document.getElementById('form-login').style.display !== 'none' ? handleLogin() : handleSignup();
    });
</script>
</body>
</html>
