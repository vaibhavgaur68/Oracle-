<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE — Planner</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--gap-lg);
            gap: var(--gap-md);
        }

        .week-label {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            flex: 1;
        }

        .day-grid { display: flex; flex-direction: column; gap: var(--gap-sm); }

        .day-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            overflow: hidden;
            transition: border-color 0.18s;
        }

        .day-row.is-today { border-color: rgba(240,165,0,0.4); }
        .day-row.is-off   { opacity: 0.35; }

        .day-header {
            display: flex;
            align-items: center;
            gap: var(--gap-md);
            padding: 14px var(--gap-md);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .day-header:active { background: var(--surface-2); }

        .day-label { min-width: 64px; }

        .day-name {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .day-row.is-today .day-name { color: var(--amber); }

        .day-date-num {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
        }

        .day-cl-wrap { flex: 1; }

        .day-cl-bar {
            height: 4px;
            background: var(--surface-3);
            border-radius: var(--r-full);
            overflow: hidden;
        }

        .day-cl-fill {
            height: 100%;
            border-radius: var(--r-full);
            transition: width 0.4s ease;
        }

        .day-cl-text {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
        }

        .day-chevron {
            font-size: 11px;
            color: var(--muted);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .day-row.expanded .day-chevron { transform: rotate(180deg); }

        .day-body {
            display: none;
            padding: 0 var(--gap-md) var(--gap-md);
            border-top: 1px solid var(--border);
        }

        .day-row.expanded .day-body { display: block; }

        .planner-item {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .planner-item:last-child { border-bottom: none; }

        .planner-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .planner-title {
            flex: 1;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .planner-units {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            flex-shrink: 0;
        }

        .day-off-msg, .day-empty-msg {
            font-size: 12px;
            color: var(--muted);
            padding: var(--gap-sm) 0;
        }

        .legend {
            display: flex;
            gap: var(--gap-md);
            flex-wrap: wrap;
            margin-bottom: var(--gap-lg);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-2);
        }

        .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="dashboard.html" class="nav-logo">ORACLE</a>
    <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="tasks.html">Tasks</a></li>
        <li><a href="planner.html" class="active">Planner</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="#" id="nav-logout">Log out</a></li>
    </ul>
</nav>

<nav class="bottom-nav">
    <a href="dashboard.html"><span class="icon">⊞</span>Today</a>
    <a href="tasks.html"><span class="icon">✦</span>Tasks</a>
    <a href="planner.html" class="active"><span class="icon">◫</span>Planner</a>
    <a href="settings.html"><span class="icon">◈</span>Settings</a>
</nav>

<main class="page">
    <div style="margin-bottom:var(--gap-lg);">
        <h1>Planner</h1>
        <p class="text-sm text-muted mt-sm">Full engine-generated schedule. Tap any day to expand.</p>
    </div>

    <div class="week-nav">
        <button class="btn btn-secondary btn-sm" id="prev-week">← Prev</button>
        <span class="week-label" id="week-label">—</span>
        <button class="btn btn-secondary btn-sm" id="next-week">Next →</button>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background:var(--danger)"></div>BREACH
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:var(--amber)"></div>SPRINT
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:var(--success)"></div>MARATHON
        </div>
    </div>

    <div class="day-grid" id="day-grid">
        <div class="loading-screen" style="min-height:200px;">
            <div class="spinner"></div>&nbsp;Building schedule…
        </div>
    </div>
</main>

<script type="module" src="js/planner.js"></script>
</body>
</html>
