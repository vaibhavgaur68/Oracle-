<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORACLE — Tasks</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
</head>
<body>

<nav class="nav">
    <a href="dashboard.html" class="nav-logo">ORACLE</a>
    <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="tasks.html" class="active">Tasks</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="#" id="nav-logout">Log out</a></li>
    </ul>
</nav>

<nav class="bottom-nav">
    <a href="dashboard.html"><span class="icon">⊞</span>Today</a>
    <a href="tasks.html" class="active"><span class="icon">✦</span>Tasks</a>
    <a href="planner.html"><span class="icon">◫</span>Planner</a>
    <a href="settings.html"><span class="icon">◈</span>Settings</a>
</nav>

<main class="page">
    <div class="flex-between" style="margin-bottom:var(--gap-lg);">
        <div>
            <h1>Tasks</h1>
            <p class="text-sm text-muted mt-sm" id="task-count">Loading…</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Task</button>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;gap:var(--gap-sm);flex-wrap:wrap;margin-bottom:var(--gap-lg);">
        <button class="btn btn-sm btn-secondary filter-btn active" data-filter="all">All</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Study">Study</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Work">Work</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Personal">Personal</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="General">General</button>
    </div>

    <div id="task-list">
        <div class="loading-screen" style="min-height:200px;">
            <div class="spinner"></div>&nbsp;Loading tasks…
        </div>
    </div>
</main>

<button class="fab" onclick="openAddModal()" title="Add task">+</button>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">Add Task</span>
            <button class="btn-icon" onclick="closeTaskModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Task Title</label>
                <input class="form-input" id="f-title" type="text" placeholder="What needs doing?" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="f-category">
                        <option value="General">General</option>
                        <option value="Study">Study</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="f-priority">
                        <option value="1">1 — Low</option>
                        <option value="2">2 — Normal</option>
                        <option value="3" selected>3 — Medium</option>
                        <option value="4">4 — High</option>
                        <option value="5">5 — Critical</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Total Work</label>
                    <input class="form-input" id="f-total" type="number" min="0.5" step="0.5" placeholder="e.g. 8" />
                </div>
                <div class="form-group">
                    <label class="form-label">Unit</label>
                    <select class="form-select" id="f-unit">
                        <option value="hours">Hours</option>
                        <option value="tasks">Tasks</option>
                        <option value="pages">Pages</option>
                        <option value="chapters">Chapters</option>
                        <option value="items">Items</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Deadline</label>
                <input class="form-input" id="f-deadline" type="date" />
            </div>
            <div class="form-group">
                <label class="form-label">Notes (optional)</label>
                <textarea class="form-textarea" id="f-notes" placeholder="Any extra context…"></textarea>
            </div>
            <input type="hidden" id="f-task-id" />
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
            <button class="btn btn-primary" id="modal-save-btn" onclick="saveTask()">Save Task</button>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
    <div class="modal" style="max-width:380px;">
        <div class="modal-header">
            <span class="modal-title">Delete Task?</span>
            <button class="btn-icon" onclick="closeModal('delete-modal')">✕</button>
        </div>
        <p style="color:var(--text-2);font-size:14px;line-height:1.5;">
            This will permanently delete "<strong id="delete-task-name" style="color:var(--text);"></strong>"
            and all its history. Cannot be undone.
        </p>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
            <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
        </div>
    </div>
</div>

<script type="module" src="js/tasks.js"></script>
</body>
</html>
